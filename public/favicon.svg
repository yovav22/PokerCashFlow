<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Inner circle for poker chip design -->
  <circle cx="16" cy="16" r="11" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
  
  <!-- Poker chip dots pattern -->
  <circle cx="16" cy="8" r="1.5" fill="#ef4444"/>
  <circle cx="24" cy="16" r="1.5" fill="#ef4444"/>
  <circle cx="16" cy="24" r="1.5" fill="#ef4444"/>
  <circle cx="8" cy="16" r="1.5" fill="#ef4444"/>
  
  <!-- Center design - dollar sign -->
  <text x="16" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">₪</text>
</svg> 